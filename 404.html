<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | PDFRilo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f8fc;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 520px;
      padding: 40px 24px;
      background: white;
      border: 1px solid #dce3ed;
      border-radius: 20px;
      text-align: center;
    }
    .brand { font-size: 22px; font-weight: bold; }
    .code {
      margin: 24px 0 12px;
      color: #0759b7;
      font-size: 64px;
      font-weight: bold;
    }
    h1 { font-size: 28px; }
    .message { color: #475569; line-height: 1.6; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 10px;
      background: #0759b7;
      color: white;
      font-weight: bold;
      text-decoration: none;
    }
    a:hover { background: #064a98; }
    a:focus-visible {
      outline: 3px solid #172033;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">PDFRilo</div>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p class="message">
      This page may have moved, or the address may be incorrect.
      Return to PDFRilo to edit your PDF.
    </p>
    <a href="https://pdfrilo.com/">Go to PDFRilo</a>
  </main>
</body>
</html>
